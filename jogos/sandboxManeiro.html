<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Sandbox Maneiro - Biomas & Crafting</title>
    <!-- Google Fonts - Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="assets/sandboxManeiro/style.css">
</head>

<body>
    <div id="ui">
        <div id="menu-inicial">
            <input type="text" id="nome-jogador" placeholder="Seu Nickname" value="Jogador">
            <span style="color: #555;">|</span>
            <button onclick="criarServidor()">🛠️ Criar Novo Mundo</button>
            <span style="color: #888;"> OU </span>
            <input type="text" id="id-host" placeholder="Cole o ID do Host">
            <button id="btn-entrar" onclick="entrarNoMundo()" style="background: #2196F3;">🌍 Entrar</button>
        </div>
        
        <div id="info-rede" style="display:none; justify-content: space-between; align-items: center;">
            <div>
                ID: <b id="meu-id" style="color:#4CAF50; user-select: all; background: #000; padding: 3px 8px; border-radius: 4px;">Gerando...</b>
                <span style="color: #888; margin-left: 10px;">Jogadores: <b id="qtd-jogadores">1</b></span>
            </div>
            <div id="status-musica" style="color: #E91E63; font-weight: bold; font-size: 12px;">🎵 Música On</div>
        </div>
        <div id="dica-controles">[WASD] Mover | [Teclas 1-0] Trocar Item | [Esq] Quebrar/Bater | [Dir] Colocar</div>
    </div>
    
    <div id="main-layout">
        <div id="painel-inventario"></div>
        
        <div id="jogo-container">
            <canvas id="jogo" width="1440" height="810"></canvas>
            <div id="painel-bau" style="display:none;">
                <div id="bau-header">
                    <span>Baú</span>
                    <button id="btn-fechar-bau" onclick="window.game.inventory.fecharBau()">X</button>
                </div>
                <div id="grid-bau"></div>
            </div>
        </div>

        <div id="painel-crafting">
            <span style="font-size: 14px; color: #ffeb3b; font-weight: bold;">🔨 Crafting</span>
            <div id="lista-crafting"></div>
        </div>
    </div>
    
    <!-- Modular Game Script Imports -->
    <script src="js/sandboxManeiro/Config.js"></script>
    <script src="js/sandboxManeiro/TextureManager.js"></script>
    <script src="js/sandboxManeiro/InventoryManager.js"></script>
    <script src="js/sandboxManeiro/WorldManager.js"></script>
    <script src="js/sandboxManeiro/PlayerManager.js"></script>
    <script src="js/sandboxManeiro/NetworkManager.js"></script>
    <script src="js/sandboxManeiro/Game.js"></script>
    
    <!-- Game Initialization -->
    <script>
        window.addEventListener('load', () => {
            window.game = new Game();
        });
    </script>
</body>

</html>
