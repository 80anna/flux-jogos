<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Sandbox Maneiro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #111; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
        canvas { border: 4px solid #444; border-radius: 8px; cursor: crosshair; image-rendering: pixelated; box-shadow: 0px 0px 20px rgba(0,0,0,0.8); }
        #ui { margin-bottom: 10px; background: #222; padding: 15px; border-radius: 8px; display: inline-block; width: 800px; box-sizing: border-box; }
        button, input { padding: 8px 12px; margin: 0 5px; border-radius: 4px; border: none; font-size: 14px; }
        button { background: #4CAF50; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #45a049; }
        input { background: #333; color: white; border: 1px solid #555; }
        .bloco-select { display: inline-block; width: 30px; height: 30px; margin: 0 5px; border: 3px solid transparent; cursor: pointer; vertical-align: middle; border-radius: 4px; }
        .selecionado { border-color: #ffeb3b; transform: scale(1.1); }
        #menu-inicial { display: flex; justify-content: center; align-items: center; gap: 10px; }
    </style>
</head>

<body>
    <div id="ui">
        <div id="menu-inicial">
            <button onclick="criarServidor()">🌍 Criar Novo Mundo (Host)</button>
            <span style="color: #888;"> OU </span>
            <input type="text" id="id-host" placeholder="Cole o ID do Host aqui">
            <button onclick="entrarNoMundo()" style="background: #2196F3;">🤝 Entrar no Mundo</button>
        </div>
        <div id="info-rede" style="display:none; justify-content: space-between; align-items: center;">
            <div>
                ID do Mundo: <b id="meu-id" style="color:#4CAF50; user-select: all; background: #000; padding: 3px 8px; border-radius: 4px;">Gerando...</b>
                <span style="color: #888; margin-left: 10px;">Jogadores: <b id="qtd-jogadores">1</b></span>
            </div>
            <div>
                <button onclick="iniciarMusica()" style="background: #E91E63;">🎵 Tocar Música</button>
            </div>
        </div>
        <div style="margin-top: 15px; display: none; align-items: center; justify-content: center;" id="painel-blocos">
            <span style="font-size: 12px; margin-right: 15px; color: #aaa;">[WASD/Setas] Mover & Pular | [Mouse Esq] Colocar | [Mouse Dir] Quebrar</span>
            <div class="bloco-select selecionado" id="sel-1" onclick="escolherBloco(1, this)"></div>
            <div class="bloco-select" id="sel-2" onclick="escolherBloco(2, this)"></div>
            <div class="bloco-select" id="sel-3" onclick="escolherBloco(3, this)"></div>
            <div class="bloco-select" id="sel-4" onclick="escolherBloco(4, this)"></div>
            <div class="bloco-select" id="sel-5" onclick="escolherBloco(5, this)"></div>
        </div>
    </div>
    <canvas id="jogo" width="800" height="500"></canvas>
    <script>
    // --- 1. CONFIGURAÇÕES E CÂMERA ---
    const canvas = document.getElementById('jogo');
    const ctx = canvas.getContext('2d');
    const TAM_BLOCO = 20;
    const LARGURA_MUNDO = 2000; // 200 * 20 = 4000 pixels de largura
    const ALTURA_MUNDO = 1000; // 100 * 20 = 2000 pixels de altura

    let camera = { x: 0, y: 0 };
    let mundo = [];
    let jogadores = {};
    let meuId = null;
    let blocoAtual = 1;

    // --- 2. GERADOR DE TEXTURAS PROCEDURAIS ---
    // Criamos texturas em memória para não depender de arquivos de imagem externos
    const texturas = {};

    function criarTextura(id, renderCmds) {
        let c = document.createElement('canvas');
        c.width = TAM_BLOCO;
        c.height = TAM_BLOCO;
        let cx = c.getContext('2d');
        renderCmds(cx);
        texturas[id] = c;
        // Atualiza a UI para mostrar a textura
        const sel = document.getElementById(`sel-${id}`);
        if (sel) sel.style.backgroundImage = `url(${c.toDataURL()})`;
    }

    function inicializarTexturas() {
        // 1: Terra (Marrom com ruído)
        criarTextura(1, (cx) => {
            cx.fillStyle = '#5d4037';
            cx.fillRect(0, 0, 20, 20);
            cx.fillStyle = '#4e342e';
            cx.fillRect(2, 2, 4, 4);
            cx.fillRect(12, 14, 4, 4);
            cx.fillRect(14, 4, 2, 2);
        });
        // 2: Grama (Terra embaixo, verde em cima)
        criarTextura(2, (cx) => {
            cx.fillStyle = '#5d4037';
            cx.fillRect(0, 0, 20, 20);
            cx.fillStyle = '#4CAF50';
            cx.fillRect(0, 0, 20, 6);
            cx.fillStyle = '#388E3C';
            cx.fillRect(2, 6, 4, 2);
            cx.fillRect(12, 6, 4, 2);
            cx.fillRect(16, 4, 4, 4);
        });
        // 3: Pedra (Cinza com textura dura)
        criarTextura(3, (cx) => {
            cx.fillStyle = '#757575';
            cx.fillRect(0, 0, 20, 20);
            cx.fillStyle = '#616161';
            cx.fillRect(0, 0, 20, 2);
            cx.fillRect(0, 0, 2, 20);
            cx.fillStyle = '#424242';
            cx.fillRect(18, 0, 2, 20);
            cx.fillRect(0, 18, 20, 2);
            cx.fillStyle = '#9e9e9e';
            cx.fillRect(4, 4, 4, 4);
            cx.fillRect(12, 10, 4, 4);
        });
        // 4: Madeira (Tronco de árvore)
        criarTextura(4, (cx) => {
            cx.fillStyle = '#795548';
            cx.fillRect(0, 0, 20, 20);
            cx.fillStyle = '#5D4037';
            cx.fillRect(4, 0, 2, 20);
            cx.fillRect(12, 0, 2, 20);
            cx.fillRect(8, 0, 1, 20);
        });
        // 5: Folhas (Verde translúcido)
        criarTextura(5, (cx) => {
            cx.fillStyle = 'rgba(76, 175, 80, 0.8)';
            cx.fillRect(0, 0, 20, 20);
            cx.fillStyle = 'rgba(56, 142, 60, 0.9)';
            cx.fillRect(2, 2, 6, 6);
            cx.fillRect(12, 10, 6, 6);
        });
    }
    inicializarTexturas();

    function escolherBloco(id, el) {
        blocoAtual = id;
        document.querySelectorAll('.bloco-select').forEach(b => b.classList.remove('selecionado'));
        el.classList.add('selecionado');
    }

    // --- 3. GERAÇÃO DE TERRENO (RELEVO E CAVERNAS) ---
    function gerarMundo() {
        let mapaAltura = [];
        // Relevo usando ondas senoidais sobrepostas para parecer natural
        for (let x = 0; x < LARGURA_MUNDO; x++) {
            let alturaBase = 30; // Altura média do chão (em blocos)
            let montanha = Math.sin(x / 15) * 10;
            let detalhe = Math.sin(x / 4) * 3;
            mapaAltura[x] = Math.floor(alturaBase + montanha + detalhe);
        }

        for (let x = 0; x < LARGURA_MUNDO; x++) {
            mundo[x] = [];
            for (let y = 0; y < ALTURA_MUNDO; y++) {
                let chao = mapaAltura[x];

                if (y < chao) mundo[x][y] = 0; // Céu
                else if (y === chao) mundo[x][y] = 2; // Grama
                else if (y > chao && y < chao + 4 + Math.random() * 4) mundo[x][y] = 1; // Camada de terra
                else mundo[x][y] = 3; // Pedra nas profundezas
            }
        }

        // Gerar Cavernas (Worms aleatórios)
        for (let i = 0; i < 40; i++) {
            let cx = Math.floor(Math.random() * LARGURA_MUNDO);
            let cy = 40 + Math.floor(Math.random() * 50); // Só gera caverna do meio pra baixo
            for (let passo = 0; passo < 150; passo++) {
                // Escava um buraco 2x2
                if (mundo[cx] && mundo[cx][cy]) mundo[cx][cy] = 0;
                if (mundo[cx + 1] && mundo[cx + 1][cy]) mundo[cx + 1][cy] = 0;
                if (mundo[cx] && mundo[cx][cy + 1]) mundo[cx][cy + 1] = 0;

                // Move o "verme" da caverna aleatoriamente
                cx += Math.random() > 0.5 ? 1 : -1;
                cy += Math.random() > 0.5 ? 1 : -1;
            }
        }

        // Plantar Árvores
        for (let x = 3; x < LARGURA_MUNDO - 3; x++) {
            let y = mapaAltura[x];
            // 15% de chance de ter árvore na grama
            if (mundo[x][y] === 2 && Math.random() < 0.15) {
                let alturaTronco = 3 + Math.floor(Math.random() * 3);
                // Tronco
                for (let t = 1; t <= alturaTronco; t++) mundo[x][y - t] = 4;
                // Folhas (Copa da árvore)
                let topo = y - alturaTronco;
                mundo[x][topo] = 5;
                mundo[x - 1][topo] = 5;
                mundo[x + 1][topo] = 5;
                mundo[x][topo - 1] = 5;
                mundo[x - 1][topo - 1] = 5;
                mundo[x + 1][topo - 1] = 5;
                mundo[x][topo - 2] = 5;
            }
        }
    }

    // Jogador (Spawna no meio do mundo, no topo da colina)
    let meuJogador = { x: (LARGURA_MUNDO / 2) * TAM_BLOCO, y: 0, vx: 0, vy: 0, width: 14, height: 26, cor: `hsl(${Math.random()*360}, 100%, 60%)` };
    let teclas = { a: false, d: false, w: false };

    const peer = new Peer();
    let souHost = false;
    let conexoesHost = [];
    let conexaoCliente = null;

    peer.on('open', (id) => { meuId = id; });

    function habilitarUIJogando() {
        document.getElementById('menu-inicial').style.display = 'none';
        document.getElementById('info-rede').style.display = 'flex';
        document.getElementById('painel-blocos').style.display = 'flex';
    }

    function criarServidor() {
        souHost = true;
        gerarMundo();

        // Encontrar posição Y segura para nascer
        let centroX = Math.floor(LARGURA_MUNDO / 2);
        for (let y = 0; y < ALTURA_MUNDO; y++) {
            if (mundo[centroX][y] !== 0) { meuJogador.y = (y - 2) * TAM_BLOCO; break; }
        }
        jogadores[meuId] = meuJogador;

        habilitarUIJogando();
        document.getElementById('meu-id').innerText = meuId;

        peer.on('connection', (conn) => {
            conexoesHost.push(conn);
            conn.on('open', () => {
                conn.send({ tipo: 'INIT', mundo: mundo, jogadores: jogadores });
                document.getElementById('qtd-jogadores').innerText = conexoesHost.length + 1;
            });
            conn.on('data', gerenciarDadosRede);
            conn.on('close', () => {
                delete jogadores[conn.peer];
                conexoesHost = conexoesHost.filter(c => c.peer !== conn.peer);
                document.getElementById('qtd-jogadores').innerText = conexoesHost.length + 1;
                transmitir({ tipo: 'ATUALIZAR_JOGADORES', jogadores: jogadores });
            });
        });
        loopJogo();
    }

    function entrarNoMundo() {
        const hostId = document.getElementById('id-host').value;
        if (!hostId) return;
        conexaoCliente = peer.connect(hostId);

        conexaoCliente.on('open', () => {
            habilitarUIJogando();
            document.getElementById('meu-id').innerText = "Conectado!";
            document.getElementById('qtd-jogadores').parentElement.style.display = 'none';
        });
        conexaoCliente.on('data', gerenciarDadosRede);
    }

    function transmitir(dados, ignorarId = null) {
        conexoesHost.forEach(conn => { if (conn.peer !== ignorarId) conn.send(dados); });
    }

    function gerenciarDadosRede(dados) {
        if (dados.tipo === 'INIT') {
            mundo = dados.mundo;
            jogadores = dados.jogadores;
            // Nascer perto de outro jogador
            const keys = Object.keys(jogadores);
            if (keys.length > 0) {
                meuJogador.x = jogadores[keys[0]].x;
                meuJogador.y = jogadores[keys[0]].y - 40;
            }
            jogadores[meuId] = meuJogador;
            loopJogo();
        }
        if (dados.tipo === 'ATUALIZAR_JOGADORES') {
            jogadores = dados.jogadores;
            jogadores[meuId] = meuJogador; // Mantém sua posição suave localmente
        }
        if (dados.tipo === 'MOVER' && souHost) {
            jogadores[dados.id] = dados.jogador;
            transmitir({ tipo: 'ATUALIZAR_JOGADORES', jogadores: jogadores }, null);
        }
        if (dados.tipo === 'BLOCO') {
            mundo[dados.x][dados.y] = dados.idBloco;
            if (souHost) transmitir(dados); // Repassa pro resto
        }
    }

    // --- 5. FÍSICA ---
    function verificarColisao(nx, ny) {
        const esq = Math.floor(nx / TAM_BLOCO);
        const dir = Math.floor((nx + meuJogador.width) / TAM_BLOCO);
        const topo = Math.floor(ny / TAM_BLOCO);
        const baixo = Math.floor((ny + meuJogador.height) / TAM_BLOCO);

        if (esq < 0 || dir >= LARGURA_MUNDO || topo < 0 || baixo >= ALTURA_MUNDO) return true;

        for (let i = esq; i <= dir; i++) {
            for (let j = topo; j <= baixo; j++) {
                // Ignora as folhas (ID 5) na colisão, podemos atravessá-las
                if (mundo[i] && mundo[i][j] > 0 && mundo[i][j] !== 5) return true;
            }
        }
        return false;
    }

    function atualizarFisica() {
        if (teclas.a) meuJogador.vx = -4.5;
        else if (teclas.d) meuJogador.vx = 4.5;
        else meuJogador.vx *= 0.7; // Desaceleração

        meuJogador.x += meuJogador.vx;
        if (verificarColisao(meuJogador.x, meuJogador.y)) {
            meuJogador.x -= meuJogador.vx;
            meuJogador.vx = 0;
        }

        meuJogador.vy += 0.6; // Gravidade
        if (meuJogador.vy > 12) meuJogador.vy = 12; // Terminal velocity
        meuJogador.y += meuJogador.vy;

        let noChao = false;
        if (verificarColisao(meuJogador.x, meuJogador.y)) {
            if (meuJogador.vy > 0) noChao = true;
            meuJogador.y -= meuJogador.vy;
            meuJogador.vy = 0;
        }

        if (teclas.w && noChao) meuJogador.vy = -10; // Pulo mais alto

        // Atualiza câmera
        camera.x = meuJogador.x - canvas.width / 2 + meuJogador.width / 2;
        camera.y = meuJogador.y - canvas.height / 2 + meuJogador.height / 2;

        // Trava câmera nos limites do mundo
        camera.x = Math.max(0, Math.min(camera.x, LARGURA_MUNDO * TAM_BLOCO - canvas.width));
        camera.y = Math.max(0, Math.min(camera.y, ALTURA_MUNDO * TAM_BLOCO - canvas.height));

        // Envia rede
        if (souHost) {
            jogadores[meuId] = meuJogador;
        } else if (conexaoCliente && conexaoCliente.open) {
            // Manda apenas a cada poucos frames ou envia sempre (para lan é ok)
            conexaoCliente.send({ tipo: 'MOVER', id: meuId, jogador: meuJogador });
        }
    }

    // --- 6. CONTROLES ---
    window.addEventListener('keydown', (e) => {
        if (['a', 'ArrowLeft'].includes(e.key)) teclas.a = true;
        if (['d', 'ArrowRight'].includes(e.key)) teclas.d = true;
        if (['w', 'ArrowUp', ' '].includes(e.key)) teclas.w = true;
    });
    window.addEventListener('keyup', (e) => {
        if (['a', 'ArrowLeft'].includes(e.key)) teclas.a = false;
        if (['d', 'ArrowRight'].includes(e.key)) teclas.d = false;
        if (['w', 'ArrowUp', ' '].includes(e.key)) teclas.w = false;
    });

    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        // Calcula o mouse considerando onde a câmera está
        const mouseX = e.clientX - rect.left + camera.x;
        const mouseY = e.clientY - rect.top + camera.y;

        const gridX = Math.floor(mouseX / TAM_BLOCO);
        const gridY = Math.floor(mouseY / TAM_BLOCO);

        if (gridX >= 0 && gridX < LARGURA_MUNDO && gridY >= 0 && gridY < ALTURA_MUNDO) {
            const novoBloco = (e.button === 2) ? 0 : blocoAtual;
            mundo[gridX][gridY] = novoBloco;

            const pacote = { tipo: 'BLOCO', x: gridX, y: gridY, idBloco: novoBloco };
            if (souHost) transmitir(pacote);
            else if (conexaoCliente) conexaoCliente.send(pacote);
        }
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // --- 7. GRÁFICOS (RENDERIZAÇÃO) ---
    // Desenha o fundo do céu com degradê
    function desenharFundo() {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, "#4facfe");
        grad.addColorStop(1, "#00f2fe");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function desenhar() {
        desenharFundo();

        ctx.save();
        // Move a "lente" da câmera
        ctx.translate(Math.floor(-camera.x), Math.floor(-camera.y));

        // OTIMIZAÇÃO VITAL: Desenhar apenas os blocos que estão na tela
        let inicioX = Math.max(0, Math.floor(camera.x / TAM_BLOCO));
        let fimX = Math.min(LARGURA_MUNDO, Math.ceil((camera.x + canvas.width) / TAM_BLOCO));
        let inicioY = Math.max(0, Math.floor(camera.y / TAM_BLOCO));
        let fimY = Math.min(ALTURA_MUNDO, Math.ceil((camera.y + canvas.height) / TAM_BLOCO));

        for (let x = inicioX; x < fimX; x++) {
            for (let y = inicioY; y < fimY; y++) {
                const bloco = mundo[x][y];
                if (bloco !== 0) {
                    ctx.drawImage(texturas[bloco], x * TAM_BLOCO, y * TAM_BLOCO);

                    // Escurece os blocos do fundo (Iluminação rústica de caverna)
                    if (y > 35) {
                        let escuridao = Math.min(0.8, (y - 35) * 0.05);
                        ctx.fillStyle = `rgba(0,0,0,${escuridao})`;
                        ctx.fillRect(x * TAM_BLOCO, y * TAM_BLOCO, TAM_BLOCO, TAM_BLOCO);
                    }
                }
            }
        }

        // Desenhar Jogadores
        for (let id in jogadores) {
            let p = jogadores[id];
            ctx.fillStyle = p.cor;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.width, p.height);

            // Desenha olhos no personagem
            ctx.fillStyle = 'white';
            ctx.fillRect(Math.floor(p.x) + 2, Math.floor(p.y) + 4, 4, 4);
            ctx.fillRect(Math.floor(p.x) + 8, Math.floor(p.y) + 4, 4, 4);
            ctx.fillStyle = 'black';
            let direcao = p.vx > 0 ? 2 : (p.vx < 0 ? -2 : 0);
            ctx.fillRect(Math.floor(p.x) + 3 + direcao, Math.floor(p.y) + 5, 2, 2);
            ctx.fillRect(Math.floor(p.x) + 9 + direcao, Math.floor(p.y) + 5, 2, 2);

            // Nome em cima do jogador
            ctx.fillStyle = 'white';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            let nome = id === meuId ? 'Você' : 'Amigo';
            ctx.fillText(nome, p.x + p.width / 2, p.y - 5);
        }

        ctx.restore();
    }

    // --- 8. MÚSICA GERADA POR CÓDIGO (WEB AUDIO API) ---
    let contextoAudio;

    function iniciarMusica() {
        if (contextoAudio) return; // Já está tocando
        const btn = document.querySelector('button[onclick="iniciarMusica()"]');
        btn.innerText = "🔊 Tocando";
        btn.style.background = "#4CAF50";

        contextoAudio = new(window.AudioContext || window.webkitAudioContext)();
        const escalaPentatonica = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // Escala de Dó maior

        // Loop musical procedural infinito
        setInterval(() => {
            if (Math.random() < 0.2) return; // Pausa dramática aleatória

            const osc = contextoAudio.createOscillator();
            const ganho = contextoAudio.createGain();

            osc.type = Math.random() > 0.5 ? 'sine' : 'triangle'; // Instrumento suave
            let notaBase = escalaPentatonica[Math.floor(Math.random() * escalaPentatonica.length)];
            // 10% de chance de tocar uma oitava abaixo (grave)
            osc.frequency.value = Math.random() > 0.9 ? notaBase / 2 : notaBase;

            // Configura Envelope (Surgir suave e desaparecer lento)
            ganho.gain.setValueAtTime(0, contextoAudio.currentTime);
            ganho.gain.linearRampToValueAtTime(0.1, contextoAudio.currentTime + 0.1);
            ganho.gain.exponentialRampToValueAtTime(0.001, contextoAudio.currentTime + 1.5);

            osc.connect(ganho);
            ganho.connect(contextoAudio.destination);

            osc.start();
            osc.stop(contextoAudio.currentTime + 1.5);
        }, 400); // Toca uma nota a cada 400ms
    }

    function loopJogo() {
        atualizarFisica();
        if (souHost && Object.keys(jogadores).length > 1) {
            // O host atualiza e manda as posições para evitar dessincronização grave
            transmitir({ tipo: 'ATUALIZAR_JOGADORES', jogadores: jogadores });
        }
        desenhar();
        requestAnimationFrame(loopJogo);
    }
    </script>
</body>

</html>
